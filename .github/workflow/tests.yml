name: Test

# Esegue i test automatici a ogni push e a ogni pull request.
# NON serve configurare nessun segreto: i test non toccano né Telegram né eBay.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test su Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Esegui i test
        run: python -m pytest tests/ -v